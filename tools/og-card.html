<!DOCTYPE html>
<!--
  Source for images/web/og-card.jpg, the 1200x630 link-preview card (og:image).
  It is an image of text, so re-render it when the class year or a stat changes.
  See tools/README.md for the one-line Chrome command.
  Light theme (2026-09-23), since light is the site's default: every colour is
  the site's own [data-theme="light"] token, noted beside it.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=block">
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1200px; height:630px; }
  /* --bg, --text */
  body { background:#F3F1EC; color:#1A1A18; font-family:'Manrope',sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; position:relative; }
  /* faint drafting grid, --grid-line, the token the arm figures use */
  body::before { content:''; position:absolute; inset:0;
    background-image:linear-gradient(rgba(20,19,18,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(20,19,18,.05) 1px, transparent 1px);
    background-size:30px 30px; background-position:-1px -1px; }
  .card { position:relative; display:grid; grid-template-columns:1fr 432px; height:100%; }
  .copy { padding:64px 40px 56px 72px; display:flex; flex-direction:column; }
  /* --accent-soft pill, --text-secondary (7.0:1 on the cream) */
  .eyebrow { display:inline-flex; align-self:flex-start; align-items:center; gap:12px; padding:10px 18px; border-radius:999px; background:rgba(0,0,0,.055);
    font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:#55534E; }
  /* --signal, #C8102E, 5.2:1 on the cream; --signal-soft ring */
  .eyebrow::before { content:''; width:8px; height:8px; border-radius:99px; background:#C8102E; box-shadow:0 0 0 4px rgba(200,16,46,.12); }
  h1 { font-family:'Fraunces',serif; font-weight:600; font-size:132px; line-height:.9; letter-spacing:-.035em; margin:40px 0 26px;
    font-variation-settings:'opsz' 84, 'wght' 600; }
  h1 span { font-weight:400; font-variation-settings:'opsz' 84, 'wght' 400; }
  .lead { font-size:29px; line-height:1.4; color:#55534E; max-width:21em; }   /* --text-secondary */
  /* --bg-elev panel on the grid, --border-strong edges */
  .stats { margin-top:auto; display:flex; background:#FBFAF7; border:1px solid #CDC8BC; border-radius:10px; overflow:hidden; align-self:flex-start; }
  .stat { padding:14px 22px 13px; }
  .stat + .stat { border-left:1px solid #CDC8BC; }
  .n { font-family:'Fraunces',serif; font-weight:600; font-size:34px; line-height:1; letter-spacing:-.02em; }
  .n .u { color:#C8102E; }   /* --signal */
  .k { font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:#6C6A64; margin-top:8px; }   /* --text-tertiary, 4.9:1 */
  .media { position:relative; margin:40px 40px 40px 0; border:1px solid #D2CDC1; border-radius:3px; overflow:hidden;   /* --border-frame */
    background:url('../images/web/dreams-v1-lake.jpg') 52% 44% / 128% auto no-repeat; }
  /* a cream pill on the photo, like the site's light chrome */
  .tag { position:absolute; left:14px; bottom:14px; font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.12em; text-transform:uppercase;
    color:#1A1A18; background:rgba(243,241,236,.88); border:1px solid #CDC8BC; padding:7px 12px; border-radius:999px; }
</style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <span class="eyebrow">Mechanical Eng. · Robotics · Northeastern &rsquo;29</span>
      <h1>Kyle <span>Tran</span></h1>
      <p class="lead">Autonomous survey boats, combat robots, and the embedded systems that run them.</p>
      <div class="stats">
        <div class="stat"><div class="n">4<span class="u">th</span></div><div class="k">National</div></div>
        <div class="stat"><div class="n">16</div><div class="k">Team podiums</div></div>
        <div class="stat"><div class="n">3.87</div><div class="k">GPA</div></div>
      </div>
    </div>
    <div class="media"><span class="tag">D.R.E.A.M.S v1</span></div>
  </div>
</body>
</html>
